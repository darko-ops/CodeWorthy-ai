# Deploy the Steward service to Fly.io on push to main.
#
# Test-gated: the same typecheck + full suite (including the no-merge/force/delete
# doctrine) must pass before anything ships. Path-filtered to server/** so a
# docs- or site-only change never triggers a redeploy.
#
# Requires one repo secret: FLY_API_TOKEN  (create with `fly tokens create deploy`).
name: Deploy Steward (Fly.io)

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch: {}

# Never let two deploys race; don't cancel an in-flight deploy.
concurrency:
  group: deploy-steward
  cancel-in-progress: false

jobs:
  test:
    name: Test before deploy
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: acme
          POSTGRES_PASSWORD: acme
          POSTGRES_DB: steward_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U acme -d steward_test"
          --health-interval 2s --health-timeout 2s --health-retries 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          DATABASE_URL: postgres://acme:acme@localhost:5432/steward_test

  deploy:
    name: Deploy to Fly.io
    needs: test
    runs-on: ubuntu-latest
    # Don't deploy from forks (they have no FLY_API_TOKEN anyway).
    if: github.repository_owner == 'darko-ops'
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # Fail with a friendly message BEFORE attempting a deploy if the token is
      # missing or the app hasn't been created yet (the one-time `fly launch`).
      - name: Preflight — token set and app exists
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "::error::FLY_API_TOKEN is not set. Create one with 'fly tokens create deploy' and add it as a repo secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          app="$(sed -n 's/^app *= *"\(.*\)"/\1/p' fly.toml | head -1)"
          if ! flyctl status --app "$app" >/dev/null 2>err.log; then
            echo "::error::Fly app '$app' not found. First deploy? Run a one-time 'fly launch' (or 'fly apps create $app') locally to create it, then re-run this workflow. flyctl said:"
            sed 's/^/  /' err.log
            exit 1
          fi
          echo "Preflight OK — '$app' exists; deploying."
      # Reads server/fly.toml + server/Dockerfile; the release_command applies
      # migrations before the new version takes traffic.
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
