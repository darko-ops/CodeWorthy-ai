# CodeWorthy Steward — Fly.io app config.
# Deploy from steward/:  fly launch --copy-config --name codeworthy-steward
# Secrets to set (fly secrets set ...):
#   DATABASE_URL GITHUB_APP_ID GITHUB_APP_PRIVATE_KEY GITHUB_WEBHOOK_SECRET
#   STEWARD_LOG_TOKEN [STEWARD_LLM=1 ANTHROPIC_API_KEY]
app = "codeworthy-steward"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[checks]
  [checks.health]
    type = "http"
    port = 8080
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
